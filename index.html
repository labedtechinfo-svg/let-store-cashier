
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LET STORE CASHIER V5</title>
<style>
body{font-family:Arial;background:#1f1f1f;color:white;padding:20px}
.box{max-width:700px;margin:auto;background:#2b2b2b;padding:20px;border-radius:12px}
h1{text-align:center}
label{display:block;margin-top:12px}
input{width:100%;padding:12px;font-size:24px;border-radius:8px;border:none;margin-top:5px}
.result{background:#3a3a3a}
</style>
</head>
<body>
<div class="box">
<h1>LET STORE CASHIER</h1>

<label>Order Total ($)</label>
<input id="total" type="number" value="20" oninput="calc()">

<label>Customer Gives ($)</label>
<input id="usd" type="number" value="10" oninput="calc()">

<label>Customer Gives (៛)</label>
<input id="khr" type="number" value="100000" oninput="calc()">

<label>Exchange Rate</label>
<input id="rate" type="number" value="4000" oninput="calc()">

<hr>

<label>Total Received ($)</label>
<input id="received" class="result" readonly>

<label>Change ($)</label>
<input id="changeusd" class="result" readonly>

<label>Change (៛)</label>
<input id="changekhr" class="result" readonly>

</div>

<script>
function calc(){
let total=parseFloat(document.getElementById('total').value)||0;
let usd=parseFloat(document.getElementById('usd').value)||0;
let khr=parseFloat(document.getElementById('khr').value)||0;
let rate=parseFloat(document.getElementById('rate').value)||4000;

let received=usd+(khr/rate);
let changeusd=received-total;
let changekhr=changeusd*rate;

document.getElementById('received').value=received.toFixed(2);
document.getElementById('changeusd').value=changeusd.toFixed(2);
document.getElementById('changekhr').value=Math.round(changekhr).toLocaleString();
}
calc();
</script>
</body>
</html>
